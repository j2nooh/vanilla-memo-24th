<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <title>Vanilla Memo</title>
  </head>
  <body>
    <main id="app" class="memo-app">
      <header class="memo-header">
        <h1 class="visually-hidden">바닐라 메모</h1>

        <form class="search-form" role="search">
          <div class="tag-filter">
            <button
              id="tag-filter-button"
              class="tag-filter-button"
              type="button"
              aria-expanded="false"
              aria-controls="tag-filter-menu"
            >
              <span class="tag-filter-label">태그 선택</span>
              <img class="tag-filter-icon" src="./assets/icons/tag-arrow.svg" alt="" />
            </button>
            <div id="tag-filter-menu" class="tag-filter-menu" hidden>
              <button type="button" data-category="">전체</button>
              <button type="button" data-category="daily">Daily</button>
              <button type="button" data-category="work">Work</button>
              <button type="button" data-category="others">Others</button>
            </div>
          </div>
          <label class="visually-hidden" for="memo-search">메모 검색</label>
          <input
            id="memo-search"
            class="search-input"
            type="search"
            placeholder="원하는 메모를 검색하세요"
          />
          <button id="search-clear-button" class="search-clear-button" type="button" hidden>
            <span class="search-clear-icon" aria-hidden="true"></span>
            <span class="visually-hidden">검색어 지우기</span>
          </button>
          <button class="search-button" type="submit" aria-label="메모 검색">
            <img src="./assets/icons/search.svg" alt="" />
          </button>
        </form>

        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="메모 작성">
            <img src="./assets/icons/plus.svg" alt="" />
          </button>
          <button class="icon-button" type="button" aria-label="프로필">
            <img src="./assets/icons/profile.svg" alt="" />
          </button>
        </div>
      </header>

      <section class="memo-section" aria-labelledby="memo-list-title">
        <h2 id="memo-list-title" class="visually-hidden">메모 목록</h2>
        <p id="memo-announcement" class="visually-hidden" aria-live="polite"></p>
        <ul class="memo-grid" aria-label="고정된 메모" hidden></ul>
        <ul class="memo-grid" aria-label="작성된 메모"></ul>
        <div id="search-empty-state" class="empty-state empty-state--search" hidden>
          <div class="search-empty-content">
            <span class="search-empty-icon" aria-hidden="true"></span>
            <div class="search-empty-copy">
              <h3>검색 결과가 없습니다</h3>
              <p>다른 검색어로 다시 시도해보세요</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <dialog id="memo-detail-dialog" class="memo-detail-dialog" aria-labelledby="memo-detail-title">
      <article class="memo-detail-content">
        <header class="memo-detail-header">
          <h2 id="memo-detail-title"></h2>
          <button id="memo-detail-close-button" class="memo-detail-close-button" type="button">
            <img src="./assets/icons/exit.svg" alt="" />
            <span class="visually-hidden">상세 메모 닫기</span>
          </button>
        </header>
        <div class="memo-detail-main">
          <div class="memo-detail-meta">
            <span id="memo-detail-category" class="memo-detail-category"></span>
            <img class="memo-detail-divider" src="./assets/icons/bar.svg" alt="" />
            <time id="memo-detail-date"></time>
          </div>
          <p id="memo-detail-body" class="memo-detail-body"></p>
        </div>
        <footer class="memo-detail-actions">
          <button class="memo-detail-action-button" type="button" aria-label="메모 수정">
            <img src="./assets/icons/modify.svg" alt="" />
          </button>
          <button class="memo-detail-action-button" type="button" aria-label="메모 삭제">
            <img src="./assets/icons/delete.svg" alt="" />
          </button>
        </footer>
      </article>
    </dialog>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
